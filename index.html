<!DOCTYPE html>
<html lang="tr" data-anim="off">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vCard Tool</title>
<script data-pref>
/* ilk boyamadan ÖNCE: tarayıcının tema & dil tercihini uygula
   (koyu sistem → koyu site, açık sistem → açık site; TR tarayıcı → TR arayüz) */
(function(){
  try {
    document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    var nav = (navigator.language || 'tr').toLowerCase();
    document.documentElement.lang = nav.indexOf('tr') === 0 ? 'tr' : 'en';
  } catch (e) { /* eski tarayıcı: koyu + TR kalır */ }
})();
</script>
<!-- Gizlilik: bu uygulama kişi verilerini hiçbir yere göndermez, hiçbir veri kaydetmez.
     Tek dış istek: Twemoji SVG görselleri (cdn.jsdelivr.net). Kişi verisi asla isteklerde yer almaz. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; manifest-src 'self'; font-src self; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="description" content="VCF kişi dosyalarını aç, karşılaştır, birleştir. Tamamen tarayıcında, gizlilik odaklı.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kişiler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
:root{ /* varsayılan: KOYU tema */
  --bg:#0b0e14; --card:#131824; --ink:#e9ecf4; --muted:#8a93aa; --line:#222b3d; --input:#1a2130;
  --accent:#6a8dff; --accent-soft:#1c2743; --accent-ink:#0b0e14;
  --danger:#ff5c7c; --danger-soft:#3a1c26; --ok:#34d399; --ok-soft:#12301f; --warn:#f5b04d; --warn-soft:#33270f;
  --t-a:#232a48; --t-a-ink:#a5b4fc; --t-b:#14312a; --t-b-ink:#6ee7b7; --t-ab:#1b2a52; --t-ab-ink:#93c5fd;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:16px;
}
[data-theme="light"]{
  --bg:#f4f6fa; --card:#ffffff; --ink:#10131a; --muted:#68718a; --line:#e5e9f0; --input:#f2f4f8;
  --accent:#4f7cff; --accent-soft:#e9efff; --accent-ink:#ffffff;
  --danger:#e11d48; --danger-soft:#ffe9ee; --ok:#059669; --ok-soft:#dcf7ee; --warn:#b45309; --warn-soft:#fdf0d9;
  --t-a:#eef1ff; --t-a-ink:#4353c9; --t-b:#e4f7ef; --t-b-ink:#0b7a53; --t-ab:#e3ecff; --t-ab-ink:#2563eb;
  --shadow:0 10px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{color-scheme:dark;scroll-behavior:smooth}
html[data-theme="light"]{color-scheme:light}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  transition:background .25s,color .25s;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:var(--ink)}
svg{flex:none}
.app{max-width:880px;margin:0 auto;padding:18px 16px 80px;
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  padding-bottom:max(80px, env(safe-area-inset-bottom) + 40px);}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8b5cf6);
  display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(79,124,255,.35)}
.logo .eic{width:24px;height:24px}
.brand{flex:1;min-width:0}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand p{font-size:12px;color:var(--muted);margin-top:1px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
  background:var(--card);border:1px solid var(--line);transition:.15s;font-size:16px;line-height:1;padding:0}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .eic{width:16px;height:16px}
/* emoji ikon kapları: boyutlar bağlama göre; img her zaman kabı doldurur */
.eic{display:inline-grid;place-items:center;line-height:1;flex:none;width:1em;height:1em;font-size:14px;vertical-align:middle}
.eic>img{width:100%;height:100%;display:block}
.logo .eic{font-size:24px}
.icon-btn .eic{font-size:15px}
.btn .eic{width:14px;height:14px}
.btn img{width:14px;height:14px}
.search .eic{width:14px;height:14px;color:var(--muted)}
.slot-chip .eic{width:14px;height:14px}
.ghost .eic{width:12px;height:12px}
.sub .chip .flag{width:15px;height:11px;margin:0;vertical-align:0;box-shadow:none}
.icon-btn .eic{width:16px;height:16px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.slot-chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;
  background:var(--card);border:1.5px dashed var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.15s;max-width:280px}
.slot-chip .dot{width:8px;height:8px;border-radius:50%;flex:none;transition:background-color .4s cubic-bezier(.4,0,.2,1),box-shadow .4s ease}
.slot-chip .dot.off{background:var(--danger);box-shadow:0 0 0 0 rgba(239,68,68,.5);animation:pulse 2.2s infinite}
.slot-chip .dot.on{background:var(--ok);box-shadow:0 0 6px rgba(16,185,129,.55)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.slot-chip:hover{border-color:var(--accent);color:var(--ink)}
.slot-chip.active{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.slot-chip.filled{border-style:solid}
.slot-chip.filled[data-slot="0"] .dot{background:var(--accent)}
.slot-chip.filled[data-slot="1"] .dot{background:var(--ok)}
.slot-chip .cnt{background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.slot-chip span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;font-size:13px;
  font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:15px;height:15px}
.btn .eic{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}
.btn.ok{color:var(--ok);border-color:transparent;background:var(--ok-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- tabs ---------- */
/* emoji/ikon görselleri sürüklenemez (ortadaki 📖 dahil) */
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
/* yumuşak tema geçişi (renkler + gölgeler). html[data-anim=off] iken devre dışı:
   ilk temayla dalgalanmayı önlemek için; başlangıçta JS açar */
html[data-anim="off"] *{transition-duration:0s!important;animation-duration:0s!important;animation-delay:0s!important}
/* yumuşak tema geçişi (renkler + gölgeler) */
body,.app,.modal,.row,.tab,.btn,.panel,.search,.slot-chip,.countbar,.ghead,.empty,.tag,.chip,.avatar{transition:background-color .45s cubic-bezier(.4,0,.2,1),color .45s cubic-bezier(.4,0,.2,1),border-color .45s cubic-bezier(.4,0,.2,1)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:12px;width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab .eic{width:13px;height:13px}
/* sekmede dosya kapatma düğmesi: her zaman görünür mini çip, hover'da kırmızı daire */
.tab .tab-x{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;border-radius:50%;
  font-size:10px;line-height:1;font-weight:700;color:var(--muted);
  background:var(--input);box-shadow:inset 0 0 0 1px var(--line);
  position:relative;transition:background .15s,color .15s,box-shadow .15s,transform .1s}
.tab .tab-x::before{content:'';position:absolute;inset:-8px}   /* dokunmatik: 15px + 16px = ~31px hedef */
.tab.on .tab-x{color:var(--accent-ink);background:rgba(255,255,255,.18);box-shadow:none}
[data-theme="light"] .tab.on .tab-x{background:rgba(255,255,255,.45)}
.tab .tab-x:hover{background:var(--danger);box-shadow:none;color:#fff;transform:scale(1.12)}
.tab .tab-x:active{transform:scale(.9)}
.tab .tab-nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab,.btn,.mini,.icon-btn{transition:background-color .25s cubic-bezier(.4,0,.2,1),color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .15s cubic-bezier(.34,1.56,.64,1),opacity .25s ease}
.tab:active,.btn:active,.mini:active,.icon-btn:active{transform:scale(.96)}
@keyframes iconPop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
.icon-pop{animation:iconPop .45s cubic-bezier(.34,1.56,.64,1)}

/* ---------- panel ---------- */
.panel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.search svg{width:15px;height:15px;color:var(--muted)}
.search .eic{width:15px;height:15px}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px}
.search input::placeholder{color:var(--muted)}
.countbar{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.countbar b{color:var(--ink)}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.3px}
.t-a{background:var(--t-a);color:var(--t-a-ink)} .t-b{background:var(--t-b);color:var(--t-b-ink)}
.t-ab{background:var(--t-ab);color:var(--t-ab-ink)} .t-keep{background:var(--ok-soft);color:var(--ok)}
.tag.src{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.t-dis{background:var(--danger-soft);color:var(--danger)} .t-ed{background:var(--warn-soft);color:var(--warn)}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.ghead{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);padding:10px 6px 2px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:13px;padding:12px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:.15s}
.row:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none;overflow:hidden}
.avatar.avatar-emoji{background:var(--input);display:flex;align-items:center;justify-content:center;gap:1px}
.avatar .avatar-img{width:62%;height:62%}
.flag{width:18px;height:13.5px;border-radius:2.5px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:inline-block;vertical-align:-1px;flex:none}
.emoji{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:none}
.mid{flex:1;min-width:0}
.name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
/* uzun isimler: satırı taşan kısım "…" ile kısalır (flex içinde ellipsis için sarmalayıcı şart) */
.name .ntxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name .tag{flex:none}
.sub{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0}
.sub .chip{background:var(--input);border-radius:99px;padding:2px 9px;font-size:11.5px;display:inline-flex;align-items:center;gap:4px;flex:none;white-space:nowrap}
.sub .chip .flag{width:15px;height:11px;margin:0;vertical-align:0;box-shadow:none}
.row-acts{display:flex;align-items:center;gap:6px}
.mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:.12s}
.mini svg{width:15px;height:15px}
.mini .eic{font-size:13px}
.mini .eic>img{width:13px;height:13px;display:block}
.mini img{width:14px;height:14px}
.mini:hover{background:var(--input);color:var(--ink)}
/* sürükleyip bırakma katmanı */
#dropOverlay{position:fixed;inset:0;background:rgba(79,124,255,.18);backdrop-filter:blur(2px);border:3px dashed var(--accent);
  display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none;font-size:17px;font-weight:700;color:var(--accent);
  text-shadow:0 1px 8px rgba(0,0,0,.35);animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* liste satırı giriş animasyonu */
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{animation:rowIn .35s cubic-bezier(.22,1,.36,1)}
#dropOverlay .eic{font-size:34px;margin-right:10px}
#dropOverlay .eic>img{width:34px;height:34px}

/* ---------- alfabe şeridi (temel) — arka planı yok, şeffaf ray ---------- */
.alpha-strip[hidden],.selbar[hidden]{display:none}
.alpha-strip{display:flex;gap:2px;padding:6px 4px;background:transparent;border:none}
.alpha-strip .adis{opacity:.28;cursor:default;pointer-events:none}
.alpha-strip .adis:hover{background:none;color:var(--muted)}

/* ---------- toplu seçim ---------- */
.row .selbox{flex:none;width:19px;height:19px;accent-color:var(--accent);cursor:pointer;margin:0 2px 0 0}
.selbar{display:flex;align-items:center;gap:9px;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--accent);flex-wrap:wrap}
/* seçim çubuğu görünür olunca mini slide-up */
.selbar.showing{animation:selIn .34s cubic-bezier(.34,1.45,.64,1)}
@keyframes selIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.selbar .spacer{flex:1}
.mini.del.on{background:var(--danger-soft);color:var(--danger)}
.mini.keep.on{background:var(--ok-soft);color:var(--ok)}
.mini.dis.on{background:var(--danger-soft);color:var(--danger)}
.mini.del:hover{background:var(--danger-soft);color:var(--danger)}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--card)}}
.row.flash{animation:flash 1.6s ease}

/* ---------- empty & skeleton ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;margin-bottom:14px;opacity:.5}
.empty img{width:38px;height:38px;margin-bottom:14px;opacity:.6;display:block;margin-left:auto;margin-right:auto}
.empty h3{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}
.empty p{font-size:13px;line-height:1.6;max-width:340px;margin:0 auto}
.empty .btn{margin-top:16px}
.skel{display:flex;gap:13px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);align-items:center}
.sk-av{width:42px;height:42px;border-radius:50%;flex:none}
.sk-l{height:11px;border-radius:6px}
@keyframes shine{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel .sk-av,.skel .sk-l{background:linear-gradient(90deg,var(--input) 25%,var(--card) 50%,var(--input) 75%);background-size:800px 100%;animation:shine 1.4s infinite linear}

/* ---------- modals ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,14,25,.5);backdrop-filter:blur(3px);
  padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:100%;max-width:640px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25);
  animation:pop .42s cubic-bezier(.22,1.28,.36,1)}
.modal.narrow{max-width:420px}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:scale(.9) translateY(26px);opacity:0}to{transform:none;opacity:1}}
/* modal kapanış animasyonu: ölçekle-küçül-soldur, sonra display:none */
.modal-back.closing .modal{animation:unpop .22s cubic-bezier(.4,0,.68,.06) forwards}
@keyframes unpop{to{transform:scale(.93) translateY(18px);opacity:0}}
.modal-back.closing{animation:fadeBack .22s ease forwards}
@keyframes fadeBack{to{opacity:0}}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px 0}
.modal-head h2{font-size:16px;font-weight:700;flex:1}
.modal-body{padding:16px 22px;overflow-y:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .left{margin-right:auto}

/* merge summary cards */
.sumcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.sumcard{background:var(--input);border-radius:13px;padding:11px 14px}
.sumcard .v{font-size:20px;font-weight:800;letter-spacing:-.5px}
.sumcard .l{font-size:11.5px;color:var(--muted);margin-top:1px}
.sumcard.ok .v{color:var(--ok)} .sumcard.warn .v{color:var(--warn)}

.mtabs{display:flex;gap:4px;margin-bottom:12px}
.mtabs .tab{padding:6px 12px;font-size:12px}
.mrow{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:8px}
.m-mid{flex:1;min-width:0}
.m-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.m-name .ntxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.m-sub{font-size:12px;color:var(--muted);margin:2px 0 7px}
.m-sub .chg{color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--input);cursor:pointer;transition:.12s}
.chip:hover{background:var(--accent-soft);color:var(--accent)}
.chip.c-a{background:var(--t-a);color:var(--t-a-ink)} .chip.c-b{background:var(--t-b);color:var(--t-b-ink)}
.chip.c-ab{background:var(--t-ab);color:var(--t-ab-ink)}
.chip .srcnm{font-weight:500;opacity:.85;margin-left:4px}
.m-acts{display:flex;gap:5px}
.m-acts .mini{border:1px solid var(--line)}
.m-acts .mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.m-acts .mini.rst.on{background:var(--input);color:var(--muted);border-color:var(--line)}
.mnote{font-size:12.5px;color:var(--muted);background:var(--input);border-radius:11px;padding:10px 13px;margin-bottom:12px;line-height:1.55}
.mdone{display:flex;align-items:center;gap:9px;background:var(--ok-soft);color:var(--ok);font-weight:700;
  border-radius:13px;padding:13px 16px;margin-bottom:12px;font-size:14px}
.mdone img{width:16px;height:16px}

/* form fields */
.f-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.f-label:first-child{margin-top:0}
.f-input{width:100%;background:var(--input);border:1.5px solid transparent;border-radius:11px;padding:10px 13px;font-size:14px;outline:none;transition:.15s}
.f-input:focus{border-color:var(--accent);background:var(--card)}
.f-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.f-row .f-input{flex:1}
.ghost{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:7px 11px;border-radius:10px;border:1px dashed var(--line);transition:.15s}
.ghost:hover{color:var(--accent);border-color:var(--accent)}
.ghost svg{width:13px;height:13px}

/* confirm */
.confirm-text{font-size:14px;line-height:1.65;color:var(--muted);padding:6px 0 2px}
.confirm-text b{color:var(--ink)}

/* help */
.help-sec{margin-bottom:16px}
.help-sec h4{font-size:13.5px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.help-sec h4 .st{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:14px;background:var(--input);flex:none}
.help-sec h4 .st .eic{font-size:13px;width:13px;height:13px}
.st .eic{font-size:13px;width:13px;height:13px}
.help-sec p{font-size:13px;color:var(--muted);line-height:1.65}
kbd{background:var(--input);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}

/* toast */
#toast{position:fixed;left:50%;bottom:max(26px, env(safe-area-inset-bottom) + 12px);transform:translateX(-50%) translateY(0) scale(.92);background:#111827;color:#f9fafb;
  padding:11px 20px;border-radius:13px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .32s cubic-bezier(.4,0,.2,1),transform .38s cubic-bezier(.34,1.56,.64,1);z-index:99;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
[data-theme="light"] #toast{background:#e5e9f0;color:#111827}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#toast.err{background:var(--danger);color:#fff}

/* yığılabilir bildirimler */
#toastBox{position:fixed;left:50%;bottom:max(26px, env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;align-items:center;z-index:99;pointer-events:none;max-width:90vw}
.toast{display:flex;align-items:center;gap:9px;background:#111827;color:#f9fafb;
  padding:11px 20px;border-radius:13px;font-size:13.5px;font-weight:600;
  opacity:0;transform:translateY(14px) scale(.94);
  transition:opacity .32s cubic-bezier(.4,0,.2,1),transform .42s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 10px 30px rgba(0,0,0,.3)}
[data-theme="light"] .toast{background:#e5e9f0;color:#111827}
.toast.in{opacity:1;transform:none}
.toast.err{background:var(--danger);color:#fff}
.toast .eic{font-size:14px;display:flex}

/* liste + dikey alfabe rayı yerleşimi: ray kişilerin solunda, yukarıdan aşağı */
#listWrap{display:flex;gap:14px;align-items:flex-start}
/* liste kendi içinde kayar: üstündeyken mouse scroll sadece listeyi indirir (sayfa kaymaz);
   listenin bittiği yerde sayfa devam eder */
#list{flex:1;min-width:0;max-height:calc(100vh - 240px);overflow-y:auto;overscroll-behavior:contain;
  padding:8px 22px 8px 2px}   /* üst/alt nefes payı + sağda 22px: çubuk listeye yapışmasın */
/* ---------- özel (JS) kaydırma çubukları: liste + alfabe rayı BİREBİR aynı topuz ----------
   native scrollbar'ların boyutu tarayıcıya bağlı olduğundan eşleşmiyordu;
   artık ikisi de aynı formülle (görünen/oran) boyutlanıyor, aynı renk/ kalınlıkta */
.custom-sb{position:absolute;top:8px;bottom:8px;width:8px;pointer-events:auto;z-index:6;cursor:pointer}
.custom-sb .sb-thumb{position:absolute;left:0;width:100%;border-radius:99px;
  background:color-mix(in srgb, var(--accent) 72%, transparent);transition:background .15s}
.custom-sb:hover .sb-thumb{background:var(--accent)}
#sbList{right:3px}
#sbList .sb-thumb{min-height:44px}
#sbList .sb-thumb{min-height:44px}
#sbAlpha{width:6px}
#sbAlpha .sb-thumb{min-height:34px;background:color-mix(in srgb, var(--accent) 55%, transparent)}
#sbAlpha:hover .sb-thumb{background:var(--accent)}
#list,#alphaStrip{scrollbar-width:none}
#list::-webkit-scrollbar,#alphaStrip::-webkit-scrollbar{display:none}
/* listenin alt kenarında yumuşak geçiş: kaydırılabilir alan olduğu belli olsun */
#listWrap{position:relative}
#listWrap::after{content:'';position:absolute;left:0;right:14px;bottom:-1px;height:44px;
  background:linear-gradient(to bottom, transparent, var(--bg));
  pointer-events:none;border-radius:0 0 var(--radius) var(--radius);opacity:0;transition:opacity .25s}
#listWrap.scrolled::after{opacity:1}
[data-theme="light"] #listWrap::after{background:linear-gradient(to bottom, transparent, var(--bg))}
/* alfabe rayı: her zaman dikey, aktif harf vurgusu; çubuğu özel çizilir (yukarıda) */
#alphaStrip{position:sticky;top:6px;z-index:5;flex:none;align-self:flex-start;
  flex-direction:column;flex-wrap:nowrap;max-height:calc(100vh - 220px);
  overflow-y:auto;overscroll-behavior:contain;
  padding:5px 12px 5px 4px;margin:0}
#alphaStrip button{min-width:24px;width:24px;height:24px;padding:0;border-radius:7px;font-size:11px;font-weight:700;
  color:var(--muted);display:grid;place-items:center;transition:background .12s,color .12s;flex:none}
#alphaStrip button:hover{background:var(--accent-soft);color:var(--accent)}
#alphaStrip button.here{background:var(--accent);color:var(--accent-ink);transform:scale(1.08)}

@media (max-width:600px){
  .app{padding-top:calc(14px + env(safe-area-inset-top))}

  /* 16px input → iOS odaklanınca yakınlaştırma tetiklenmez */
  input,textarea{font-size:16px}

  /* dar ekran: alfabe rayı yine solda dikey kalır, sadece biraz kısalır */
  #alphaStrip{max-height:calc(100vh - 260px)}
}

<script>
"use strict";
/* ============================================================
   vCard Tool — tek dosya, tamamen tarayıcıda çalışır
   ============================================================ */

/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const norm = s => String(s ?? '').toLocaleLowerCase('tr').replace(/\s+/g,' ').trim();
const sameName = a => norm(a).replace(/\u00a0/g,' ');
const digits = s => String(s ?? '').replace(/\D/g,'');
const normPhone = a => { const d = digits(a); return d.length > 10 && d[0] === '0' ? '9' + d : d; };
const samePhone = a => normPhone(a);
const sameEmail = a => String(a ?? '').trim().toLocaleLowerCase('tr');
const sortKeyOf = p => norm(p.name);

/* grup sıralaması: alfabe rayı ile kişi listesi AYNI sırayı kullanır.
   rank: emojiler(0) → CJK/仮/가(1) → harfler(2) → sayılar(3) → semboller/diğer(4).
   ICU collation'ı (localeCompare) sembolleri öne, CJK'yu sona attığı için düz
   localeCompare listesi ray ile çakışıyordu — önce rank, sonra isim karşılaştırılır */
function groupRank(g) {
  if (g === GRP_EMOJI) return 0;
  if (g === 'CJK' || g === '仮' || g === '가') return 1;
  if (/\p{L}/u.test(g)) return 2;
  if (g === GRP_NUM) return 3;
  return 4;
}
function comparePeople(x, y) {
  const gx = alphaGroupOf(x), gy = alphaGroupOf(y);
  const rx = groupRank(gx), ry = groupRank(gy);
  if (rx !== ry) return rx - ry;
  if (rx === 2 && gx !== gy) return gx.localeCompare(gy, 'tr');   // harf grupları: A < B < Ç ...
  return sortKeyOf(x).localeCompare(sortKeyOf(y), 'tr', { numeric: true });
}
/* ismin başındaki emoji zincirini soyar ("🇹🇷 Ahmet" → "Ahmet") */
function stripLeadEmojis(s) {
  let r = String(s || '').trim();
  for (;;) {
    const m = r.match(EMOJI_LEAD_RE);
    if (!m || !m[0]) return r;
    r = r.slice(m[0].length).trim();
  }
}
const initials = n => {
  const s = stripLeadEmojis(n);
  const w = s.split(/\s+/).filter(Boolean).filter(x => stripLeadEmojis(x));   // tamamen emojiden oluşan kelimeleri atla
  return ((w[0]?.[0]||'') + (w[1]?.[0]||w[0]?.[1]||'')).toLocaleUpperCase('tr') || '?';
};
const AVATAR_COLORS = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#3b82f6'];
const avatarBg = n => { let h = 0; for (const c of String(n||'')) h = (h*31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; };
const trunc = (s,n) => s.length > n ? s.slice(0,n-1) + '…' : s;
const haystack = p => norm(p.name + ' ' + p.phones.join(' ') + ' ' + p.emails.join(' '));

/* ---------- alfabe grubu: tüm dillerin harfleri, sayılar, özel karakterler ve emojiler ---------- */
/* grup sırası: emojiler → harfler (tüm alfabeler, gerçek alfabe sırasına göre) → sayılar → diğer karakterler */
const GRP_EMOJI = '😊';
const GRP_NUM = '#';
const GRP_OTHER = '@';
const CJK_RE = /[\u3400-\u4DBF\u4E00-\u9FFF\u{20000}-\u{2A6DF}\u{2A700}-\u{2EBEF}\u{2F800}-\u{2FA1F}]/u;
const HANGUL_RE = /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/u;
const KANA_RE = /[\u3040-\u30FF]/u;
const ALPHA_RE = /\p{L}/u;

function groupOf(s) {
  const ch = [...String(s || '')][0];
  if (!ch) return GRP_OTHER;
  if (CJK_RE.test(ch)) return 'CJK';
  if (KANA_RE.test(ch)) return '仮';
  if (HANGUL_RE.test(ch)) return '가';
  if (ALPHA_RE.test(ch)) return ch.toLocaleUpperCase();
  if (/\p{N}/u.test(ch)) return GRP_NUM;
  if (EMOJI_RE.test(ch)) { EMOJI_RE.lastIndex = 0; return GRP_EMOJI;  /* Twemoji avatar çizimi */ }
  EMOJI_RE.lastIndex = 0;
  return GRP_OTHER;
}
/* ismin başındaki emojileri soyduktan sonra grupla ("🇹🇷 Ahmet" → A altında) */
const alphaGroupOf = p => groupOf(stripLeadEmojis(p.name));

/* isimler → sıralı grup listesi: [{ g, first }] — alfabe şeridi için (groupRank sırasıyla) */
function alphabetGroups(arr) {
  const map = new Map();   // g -> ilk kişinin pid'i (liste comparePeople ile sıralı gelir)
  for (const p of arr) { const g = alphaGroupOf(p); if (!map.has(g)) map.set(g, p.pid); }
  return [...map.entries()]
    .sort((x, y) => {
      const rx = groupRank(x[0]), ry = groupRank(y[0]);
      if (rx !== ry) return rx - ry;
      if (rx === 2) return x[0].localeCompare(y[0], 'tr');   // harfler: tüm diller, yerel alfabe sırası
      return 0;                                  // CJK/sayı/sembol blokları: tek grup
    })
    .map(([g, first]) => ({ g, first }));
}

/* ---------- Twemoji desteği: TÜM emojiler — SVG'ler cdn.jsdelivr.net'ten çekilir ---------- */
/* Twemoji CDN: jdecked/twemoji (resmî projenin sürdürülen hali) v15.1.0 — CC-BY 4.0 */
const TWEMOJI_CDN = 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/';

/* emoji → Twemoji dosya adı: kod noktaları sırayla hex; FE0F (varyasyon seçici) atlanır.
   "🇹🇷" → "1f1f9-1f1f7", "❤️" (U+2764 U+FE0F) → "2764", "👍🏽" → "1f44d-1f3fd" */
const emojiFile = s => [...String(s)].map(c => c.codePointAt(0).toString(16)).filter(hex => hex !== 'fe0f').join('-');

const emojiImgHtml = (s, cls) => `<img class="${cls}" src="${TWEMOJI_CDN}${emojiFile(s)}.svg" alt="${esc(s)}" loading="lazy" draggable="false" onerror="this.outerHTML=this.alt">`;

/* emoji grafiti ayrıştırıcı: emoji + ardışık ZWJ / ten rengi / varyasyon / bölgesel gösterge zinciri.
   Dikkat: bölgesel göstergeler (🇹🇷'yi oluşturan 1F1E6-1F1FF) Extended_Pictographic DEĞİLDİR —
   bu yüzden açık aralıkla eklenir. 🇹🇷 (2 gösterge), 👨‍👩‍👧 (ZWJ zinciri), 👍🏽 (ten rengi) TEK grup sayılır */
const EMOJI_RE = /(?:\p{Extended_Pictographic}|[\u{1F1E6}-\u{1F1FF}])(?:[\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\u{200D}\u{FE0F}\u{20E3}](?:\p{Extended_Pictographic}|[\u{1F1E6}-\u{1F1FF}])?|\uFE0F?)*/gu;

/* ismin başındaki emojiyi yakalar (avatar önizlemesi için) */
const EMOJI_LEAD_RE = new RegExp('^' + EMOJI_RE.source, 'u');

/* metin içindeki emojileri (bayraklar dahil) Twemoji SVG ile göster —
   Windows/ChromeOS bayrakları ve bazı emojileri çizemediği için gerekli */
/* emoji grubu → HTML; yan yana gelen birden çok bayrağı (🇹🇷🇩🇪) ikili çiftlere böler —
   Twemoji dosya adları tek bayrağa göre olduğu için */
function emojiGroupHtml(m, cls) {
  const pts = [...m].map(c => c.codePointAt(0));
  if (pts.length >= 4 && pts.every(c => c >= 0x1F1E6 && c <= 0x1F1FF)) {
    let out = '';
    for (let i = 0; i + 1 < pts.length; i += 2) out += emojiImgHtml(String.fromCodePoint(pts[i], pts[i + 1]), cls);
    return out;
  }
  return emojiImgHtml(m, cls);
}

function richText(s) {
  return esc(s).replace(EMOJI_RE, m => emojiGroupHtml(m, 'emoji'));
}

/* ülke kodu ↔ Twemoji dosya adı: "tr" ↔ "1f1f9-1f1f7" (bölgesel gösterge kod noktaları) */
const ccToName = cc => cc.split('').map(c => (c.charCodeAt(0) + 127365).toString(16)).join('-');
const nameToCc = name => name.split('-').map(p => String.fromCodePoint(parseInt(p, 16) - 127365)).join('');

/* numara → ülke kodu (ITU E.164; uzun önek önce eşleşir).
   Yaklaşımlar: '1'→us (NANP: ca/jm vb. dahil), '7'→ru (kz dahil),
   0'lı/00'lı önekler ve 10 haneli 5xx TR kayıtları normalleştirilir. */
const DIAL_CC = {
  4: { '1809':'do','1829':'do','1849':'do','1876':'jm' },
  3: { '212':'ma','213':'dz','216':'tn','218':'ly','220':'gm','221':'sn','222':'mr','223':'ml','224':'gn','225':'ci','226':'bf','227':'ne','228':'tg','229':'bj','230':'mu','231':'lr','232':'sl','233':'gh','234':'ng','235':'td','236':'cf','237':'cm','238':'cv','240':'gq','241':'ga','242':'cg','243':'cd','244':'ao','245':'gw','248':'sc','249':'sd','250':'rw','251':'et','252':'so','253':'dj','254':'ke','255':'tz','256':'ug','257':'bi','258':'mz','260':'zm','261':'mg','264':'na','265':'mw','266':'ls','267':'bw','268':'sz','269':'km','291':'er','297':'aw','298':'fo','299':'gl','350':'gi','351':'pt','352':'lu','353':'ie','354':'is','355':'al','356':'mt','357':'cy','358':'fi','359':'bg','370':'lt','371':'lv','372':'ee','373':'md','374':'am','375':'by','376':'ad','377':'mc','378':'sm','380':'ua','381':'rs','382':'me','383':'xk','385':'hr','386':'si','387':'ba','389':'mk','420':'cz','421':'sk','423':'li','501':'bz','502':'gt','503':'sv','504':'hn','505':'ni','506':'cr','507':'pa','509':'ht','590':'gp','591':'bo','592':'gy','593':'ec','594':'gf','595':'py','596':'mq','597':'sr','598':'uy','599':'cw','850':'kp','852':'hk','853':'mo','855':'kh','856':'la','880':'bd','886':'tw','960':'mv','961':'lb','962':'jo','963':'sy','964':'iq','965':'kw','966':'sa','967':'ye','968':'om','970':'ps','971':'ae','972':'il','973':'bh','974':'qa','975':'bt','976':'mn','977':'np','992':'tj','993':'tm','994':'az','995':'ge','996':'kg','998':'uz' },
  2: { '20':'eg','27':'za','30':'gr','31':'nl','32':'be','33':'fr','34':'es','36':'hu','39':'it','40':'ro','41':'ch','43':'at','44':'gb','45':'dk','46':'se','47':'no','48':'pl','49':'de','51':'pe','52':'mx','53':'cu','54':'ar','55':'br','56':'cl','57':'co','58':'ve','60':'my','61':'au','62':'id','63':'ph','64':'nz','65':'sg','66':'th','81':'jp','82':'kr','84':'vn','86':'cn','90':'tr','91':'in','92':'pk','93':'af','94':'lk','98':'ir' },
  1: { '1':'us','7':'ru' }
};

function countryFromPhone(phone) {
  let d = digits(phone);
  if (!d) return null;
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0') && d.length > 10) d = '90' + d.slice(1);   // 0'lı TR kaydı
  else if (d[0] === '0') return null;
  else if (d.length === 10 && d[0] === '5') d = '90' + d;               // operatörsüz TR kaydı
  for (const len of [4, 3, 2, 1]) {
    const cc = DIAL_CC[len][d.slice(0, len)];
    // kalan hane sayısı en az 5 olmalı ('112' gibi kısa kodlar bayrak almasın)
    if (cc && d.length - len >= 5) return cc;
  }
  return null;
}

function flagForPhone(phone) {
  const cc = countryFromPhone(phone);
  return cc ? ccToName(cc) : '';
}

const flagImgHtml = nm => nm ? `<img class="flag" src="${TWEMOJI_CDN}${nm}.svg" alt="" loading="lazy" onerror="this.outerHTML=''">` : '';

/* kişi satırı alt bilgisi: numaranın (yoksa e-postanın) yanında ülke bayrağı; tıklayınca kopyalanır */
function phoneListHtml(p) {
  const vals = p.phones.length ? p.phones : p.emails;
  return vals.map(v => {
    const cc = countryFromPhone(v);
    return `<span class="chip" data-copy="${esc(v)}">${flagImgHtml(cc ? ccToName(cc) : '')}${esc(v)}</span>`;
  }).join(' ');
}

/* fotoğrafsız kişi önizlemesi: isim tamamen emojiden oluşuyorsa bozuk metin yerine Twemoji göster */
function avatarHtml(p) {
  const nm = String(p.name || '').trim();
  const lead = nm.match(EMOJI_LEAD_RE);
  if (lead && lead[0] && !stripLeadEmojis(nm))
    return `<div class="avatar avatar-emoji">${emojiGroupHtml(lead[0], 'avatar-img')}</div>`;
  return `<div class="avatar" style="background:${avatarBg(nm)}">${esc(initials(nm))}</div>`;
}

/* aktif temayı uygula + adres çubuğu rengini senkronla (sistem tercihiyle açılır) */
function applyTheme(mode) {
  const dark = mode !== 'light';
  if (dark) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = 'light';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0e14' : '#f4f6fa');
  setEmoji($('#themeIcon'), dark ? '🌙' : '🌞');   // koyuda ay, açıkta güneş
  const ic = $('#themeIcon');
  if (ic) { ic.classList.remove('icon-pop'); void ic.offsetWidth; ic.classList.add('icon-pop'); }   // mikro animasyon
}

}

/* ---------- VCF ayrıştırma ---------- */
function parseN(v) {
  if (v.startsWith('<') && v.endsWith('>')) return v.slice(1, -1);
  const parts = v.split(';').map(s => s.replace(/^"|"$/g, '').trim());
  const fam = parts[0] || '', giv = parts[1] || '', mid = parts[2] || '';
  const name = [giv, fam, mid].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
  return name;
}

const contFor = (obj, key) => ({ get value(){ return obj[key]; }, set value(v){ obj[key] = v; } });

// vCard 2.1 quoted-printable çözümü: =XX baytları UTF-8'e, =\n soft-break'leri kaldırır
function decodeQuotedPrintable(str) {
  const bytes = [];
  let s = String(str).replace(/=\r?\n/g, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '=' && /^[0-9A-Fa-f]{2}$/.test(s.slice(i + 1, i + 3))) {
      bytes.push(parseInt(s.slice(i + 1, i + 3), 16)); i += 2;
    } else {
      for (const b of new TextEncoder().encode(c)) bytes.push(b);
    }
  }
  try { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }
  catch (e) { return String(str); }
}

function parseVcf(text) {
  const warnings = [];
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const people = [];
  let cur = null, inPerson = false;
  const propRe = /^([^:;]+)((?:;[^:]*)?):(.*)$/;
  const KNOWN_META = new Set(['VERSION','PRODID','UID','REV','TZ','GEO','CLASS','PROFILE','SOURCE','CALSCALE','SORT-STRING','MAILER','PHOTO','LOGO','SOUND','AGENT','KEY','URL','NICKNAME','BDAY','ANNIVERSARY','ADR','ORG','TITLE','ROLE','CATEGORIES','IMPP','X-SIP','FBURL']);

  for (const rawLine of lines) {
    const line = rawLine;
    if (line.startsWith(' ') || line.startsWith('\t')) {          // satır katlama (folding)
      if (cur && cur._last) cur._last.value += line.slice(1);
      continue;
    }
    const m = line.match(propRe);
    if (!m) continue;
    let prop = m[1].replace(/^item\d+\./i, '').toUpperCase();
    const params = m[2] || '';
    let value = m[3];

    if (prop === 'BEGIN' && /VCARD/i.test(value)) { cur = { name:'', phones:[], emails:[], note:'', custom:[], _last:null }; inPerson = true; continue; }
    if (!inPerson || !cur) continue;
    if (prop === 'END' && /VCARD/i.test(value)) {
      if (cur && (cur.name || cur.phones.length || cur.emails.length || cur.note))
        people.push({ name: cur.name, phones: cur.phones, emails: cur.emails, note: cur.note, noteCountry: cur.noteCountry || null, custom: cur.custom });
      cur = null; inPerson = false; continue;
    }
    if (prop === 'VERSION') continue;

    if (prop === 'TEL')    { cur.phones.push(value.trim()); cur._last = { arr: cur.phones, idx: cur.phones.length - 1 }; continue; }
    if (prop === 'EMAIL')  { cur.emails.push(value.trim()); cur._last = { arr: cur.emails, idx: cur.emails.length - 1 }; continue; }
    if (prop === 'FN')     { cur.name = value.replace(/\\n/gi,' ').trim(); cur._last = contFor(cur, 'name'); continue; }
    if (prop === 'N')      {
      if (!cur.name) {
        let v = value;
        if (/QUOTED-PRINTABLE/i.test(params)) v = decodeQuotedPrintable(v);
        cur.name = parseN(v);
      }
      cur._last = contFor(cur, 'name'); continue;
    }
    if (prop === 'NOTE')   {
      cur.note = value.trim();
      const mc = /X-ABNOTE-COUNTRY=([A-Z]{2})/i.exec(params);
      if (mc) cur.noteCountry = mc[1].toLowerCase();
      cur._last = contFor(cur, 'note');
      continue;
    }
    if (prop === 'PHOTO' || prop === 'LOGO' || prop === 'SOUND' || prop === 'KEY' || prop === 'AGENT') { cur._last = null; continue; }

    if (/^X-/.test(prop) || KNOWN_META.has(prop)) {
      if (value && value.trim() && !/^X-/.test(prop)) cur.custom.push({ key: prop + params, value: value.trim() });
      cur._last = null; continue;
    }
    warnings.push('Desteklenmeyen alan atlandı: ' + prop);
    cur._last = null;
  }
  return { people, warnings: [...new Set(warnings)] };
}

function addParsedPeople(list, slot) {
  let added = 0;
  for (const raw of list) {
    if (!raw.name && !raw.phones.length && !raw.emails.length) continue;
    const name = String(raw.name || '').trim() || raw.phones[0] || t('pm.unnamed');
    const p = {
      pid: 'p' + (state.nextPid++), slot,
      name,
      phones: raw.phones.map(x => String(x).trim()).filter(Boolean),
      emails: raw.emails.map(x => String(x).trim()).filter(Boolean),
      note: String(raw.note || ''),
      noteCountry: raw.noteCountry || countryFromPhone((raw.phones || [])[0] || '') || null,
      custom: raw.custom || [],
    };
    state.people.set(p.pid, p);
    added++;
  }
  if (added) markDirty();
  return added;
}

function loadInto(slot, file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { people: parsed, warnings } = parseVcf(String(reader.result));
      const added = addParsedPeople(parsed, slot);
      state.slots[slot] = { name: file.name, count: added };
      state.activeSlot = state.slots.length - 1;   // son dolu slot (yeni kişi ekleme hedefi)
      markDirty();
      addToast(t('toast.loaded', { n: added, name: trunc(file.name, 24) }), '📂');
      if (warnings.length) addToast(warnings[0] + (warnings.length > 1 ? ` (+${warnings.length-1})` : ''), '⚠️', true);
      renderAll();
    } catch (err) { toast(t('toast.readfail', { m: err.message }), true); }
  };
  reader.onerror = () => toast(t('toast.readfail2'), true);
  reader.readAsText(file, 'utf-8');
}

/* ---------- karşılaştırma ---------- */
function rebuildCompare(map) {
  map = map || state.people;
  const arr = [...map.values()];
  const a = arr.filter(p => p.slot === 0), b = arr.filter(p => p.slot === 1);
  const bPhones = new Map(), bEmails = new Map();
  for (const p of b) { for (const ph of p.phones) bPhones.set(samePhone(ph), p); for (const em of p.emails) bEmails.set(sameEmail(em), p); }
  const pairs = new Map(), onlyA = [], onlyB = [], usedB = new Set();
  for (const p of a) {
    let other = null;
    for (const ph of p.phones) { if (bPhones.has(samePhone(ph))) { other = bPhones.get(samePhone(ph)); break; } }
    if (!other) for (const em of p.emails) { if (bEmails.has(sameEmail(em))) { other = bEmails.get(sameEmail(em)); break; } }
    if (other && !usedB.has(other.pid)) { pairs.set(p.pid, other.pid); usedB.add(other.pid); }
    else if (!other) onlyA.push(p.pid);
  }
  for (const p of b) if (!usedB.has(p.pid)) onlyB.push(p.pid);
  const cmp = { onlyA, onlyB, pairs };
  if (map === state.people) state.compare = cmp;
  return cmp;
}

/* ---------- otomatik birleştirme ---------- */
function autoMerge(map, keep) {
  // keep: 1 → A dosyasındaki kişiler kalır (B kopyaları silinir)
  // keep: 0 → B dosyasındaki kişiler kalır (A kopyaları silinir)
  const { pairs } = rebuildCompare(map);
  const removed = []; let changed = 0;
  for (const [aPid, bPid] of pairs) {
    const pa = map.get(aPid), pb = map.get(bPid);
    if (!pa || !pb) continue;
    const winner = keep === 1 ? pa : pb;
    const loser  = keep === 1 ? pb : pa;
    if (sameName(pa.name) !== sameName(pb.name)) changed++;
    for (const ph of loser.phones) if (!winner.phones.some(x => samePhone(x) === samePhone(ph))) winner.phones.push(ph);
    for (const em of loser.emails) if (!winner.emails.some(x => sameEmail(x) === sameEmail(em))) winner.emails.push(em);
    if (!winner.noteCountry && loser.noteCountry) winner.noteCountry = loser.noteCountry;
    removed.push(loser.pid);
  }
  return { removed, changed, total: pairs.length };
}

function runMerge(keep) {
  const res = autoMerge(state.people, keep);
  for (const pid of res.removed) { state.people.delete(pid); state.deleted.add(pid); }
  if (res.removed.length) markDirty();
  return res;
}

/* ---------- görünümler ---------- */
function currentFilteredSingle() {
  let arr = [...state.people.values()];
  const q = norm(state.search);
  if (q) arr = arr.filter(p => haystack(p).includes(q));
  arr.sort(comparePeople);
  return arr;
}

/* ekranda görünen tek liste: aktif sekme + arama uygulanmış (Dışa Aktar bunu indirir) */
function visibleSingleList() {
  if (state.activeTab === 'all') return currentFilteredSingle();
  const slot = Number(state.activeTab.slice(1));
  const q = norm(state.search);
  let arr = [...state.people.values()].filter(p => p.slot === slot);
  if (q) arr = arr.filter(p => haystack(p).includes(q));
  arr.sort(comparePeople);
  return arr;
}

/* ekranda görünen tüm kişiler (tek liste: sekmeler + arama) — seçim kutuları ve alfabe şeridi bunun üzerinden çalışır */
function allVisiblePeople() {
  return state.view === 'combined' ? currentFilteredCombined().map(it => it.p) : visibleSingleList();
}

function currentFilteredCombined() {
  const { onlyA, onlyB, pairs } = rebuildCompare();
  let items = [];
  for (const pid of onlyA) { const p = state.people.get(pid); if (p) items.push({ p, mode: 'a' }); }
  for (const pid of onlyB) { const p = state.people.get(pid); if (p) items.push({ p, mode: 'b' }); }
  for (const [x] of pairs) { const p = state.people.get(x); if (p) items.push({ p, mode: 'both' }); }
  if (state.filterMode !== 'all') items = items.filter(it => it.mode === state.filterMode);
  const q = norm(state.search2);
  if (q) items = items.filter(it => haystack(it.p).includes(q));
  items.sort((x, y) => comparePeople(x.p, y.p));
  return items;
}

/* seçim kutuları: tüm görünüm türlerinde gösterilir */
const selectionEnabled = () => true;

function fileTag(slot) {
  const s = state.slots[slot];
  if (!s) return '';
  return `<span class="tag ${slot === 0 ? 't-a' : 't-b'} src" title="${esc(s.name)}">${esc(s.name)}</span>`;
}

/* dosya adı etiketi yalnızca TAM LİSTE görünümünde anlamlı (karışık kaynak);
   dosya sekmelerinde herkes aynı dosyadan olduğu için etiket gösterilmez */
const showFileTags = () => state.view === 'single' && state.activeTab === 'all';

function singleHtml() {
  if (state.activeTab === 'all') {
    const arr = currentFilteredSingle();
    const rows = [];
    let lastChar = null;
    const grouped = !norm(state.search);
    for (const p of arr) {
      if (grouped) {
        const g = alphaGroupOf(p);
        if (g !== lastChar) { rows.push(`<div class="ghead">${esc(g)}</div>`); lastChar = g; }
      }
      const acts = `<button class="mini" data-act="edit" title="Düzenle">${I.edit}</button>
           <button class="mini del" data-act="del" title="Sil">${I.trash}</button>`;
      rows.push(`<div class="row" data-pid="${p.pid}">
        <input type="checkbox" class="selbox" ${state.selection.has(p.pid) ? 'checked' : ''} title="${t('sel.tip')}">
        ${avatarHtml(p)}
        <div class="mid"><div class="name"><span class="ntxt">${richText(p.name)}</span></div><div class="sub">${phoneListHtml(p)}</div></div>
        ${showFileTags() ? fileTag(p.slot) : ''}
        <div class="row-acts">${acts}</div>
      </div>`);
    }
    return rows.join('');
  }
  // Dosya sekmeleri (her yüklü dosya kendi sekmesinde): herkes aynı dosyadan, etiket gereksiz
  const arr = visibleSingleList();
  return arr.map(p => `<div class="row" data-pid="${p.pid}">
    <input type="checkbox" class="selbox" ${state.selection.has(p.pid) ? 'checked' : ''} title="${t('sel.tip')}">
    ${avatarHtml(p)}
    <div class="mid"><div class="name"><span class="ntxt">${richText(p.name)}</span></div><div class="sub">${phoneListHtml(p)}</div></div>
    <div class="row-acts"><button class="mini" data-act="edit" title="Düzenle">${I.edit}</button><button class="mini del" data-act="del" title="Sil">${I.trash}</button></div>
  </div>`).join('');
}

function combinedHtml() {
  const items = currentFilteredCombined();
  const srcLabels = state.slots.filter(Boolean).map(s => s.name).join(' ↔ ');
  return items.map(({ p, mode }) => {
    /* karşılaştırma kaynağı: SADECE A/B yerine (çok dosyada) dosya adıyla etiket */
    const tag = mode === 'a'
      ? `<span class="tag t-a src" title="${esc(srcLabels)}">${t('tag.onlyIn')} ${esc(trunc(state.slots[0]?.name || 'A', 14))}</span>`
      : mode === 'b'
      ? `<span class="tag t-b src" title="${esc(srcLabels)}">${t('tag.onlyIn')} ${esc(trunc(state.slots[1]?.name || 'B', 14))}</span>`
      : `<span class="tag t-ab">${t('tag.both')}</span>`;
    return `<div class="row" data-pid="${p.pid}">
      <input type="checkbox" class="selbox" ${state.selection.has(p.pid) ? 'checked' : ''} title="${t('sel.tip')}">
      ${avatarHtml(p)}
      <div class="mid"><div class="name"><span class="ntxt">${richText(p.name)}</span></div><div class="sub">${phoneListHtml(p)}</div></div>
      ${tag}
      <div class="row-acts"><button class="mini add" data-act="add" title="${t('row.add')}">${I.plus}</button></div>
    </div>`;
  }).join('');
}

function emptyHtml() {
  const hasAny = state.people.size > 0;
  if (state.view === 'combined') {
    if (state.slots.filter(Boolean).length < 2) return `<div class="empty">${I.contacts}<h3>${t('empty.needTwo')}</h3><p>${t('empty.needTwoText')}</p></div>`;
    if (!currentFilteredCombined().length) return `<div class="empty">${I.contacts}<h3>${t('empty.noResult')}</h3><p>${t('empty.noResultText')}</p></div>`;
  }
  if (!hasAny) return `<div class="empty">${I.contacts}<h3>${t('empty.welcome')}</h3><p>${t('empty.welcomeText')}</p></div>`;
  return `<div class="empty">${I.contacts}<h3>${t('empty.noResult')}</h3><p>${t('empty.noSearch')}</p></div>`;
}

function renderList() {
  const list = $('#list');
  for (const pid of [...state.selection]) if (!state.people.has(pid)) state.selection.delete(pid);   // ölü seçimleri temizle
  const html = state.view === 'combined' ? (combinedHtml() || emptyHtml()) : (singleHtml() || emptyHtml());
  list.innerHTML = html;
  renderSelection();
  if (typeof updateSbList === 'function') requestAnimationFrame(updateSbList);   // içerik değişti: topuz boyu/konumu tazelensin
}

function renderTabs() {
  /* dosya sekmeleri: her yüklü dosya kendi sekmesinde; sağdaki ✕ dosyayı kapatır */
  const tabsEl = $('#tabs');
  const loaded = state.slots.filter(Boolean).length;
  /* Tam Liste çipi: yalnızca 2+ dosya varken görünür (tek dosyada kendi sekmesi yeterli) */
  const allTab = tabsEl.querySelector('.tab[data-tab="all"]');
  if (allTab) allTab.style.display = loaded >= 2 ? '' : 'none';
  /* tek dosya kaldıysa kullanıcı doğrudan o dosyanın sekmesine düşer */
  if (state.view === 'single' && loaded === 1 && state.activeTab === 'all') {
    state.activeTab = 'f' + state.slots.findIndex(Boolean);
  }
  tabsEl.querySelectorAll('.tab[data-file-tab]').forEach(el => el.remove());
  state.slots.forEach((s, i) => {
    if (!s) return;
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = 'f' + i;
    b.dataset.fileTab = '1';
    b.title = s.name;
    b.innerHTML = `<span class="eic" data-emoji="📇" data-done="1">${emojiImgHtml('📇', '')}</span><span class="tab-nm">${esc(trunc(s.name, 18))}</span><span class="tab-x" data-closefile="${i}" data-i18n-title="tab.close" title="${t('tab.close')}">✕</span>`;
    tabsEl.appendChild(b);
  });
  $$('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.tab === state.activeTab));

  $('#panelCombined').style.display = (state.view === 'combined') ? '' : 'none';
  $$('#panelCombined [data-filter]').forEach(b => b.classList.toggle('on', b.dataset.filter === state.filterMode));

function renderCount() {
  const el = $('#countbar');
  if (state.view === 'combined') {
    const { onlyA, onlyB, pairs } = state.compare;
    const shown = currentFilteredCombined().length;
    el.innerHTML = state.slots.filter(Boolean).length >= 2
      ? `<span>${t('count.showing', { n: shown })}</span><span>·</span><span>${t('count.common')} <b>${pairs.size}</b></span><span>·</span><span>${t('count.onlyA')} <b>${onlyA.length}</b></span><span>·</span><span>${t('count.onlyB')} <b>${onlyB.length}</b></span>`
      : '';
    return;
  }
  if (state.activeTab !== 'all') {
    const slot = Number(state.activeTab.slice(1));

  el.innerHTML = `<span>${t('count.showing', { n })}</span>` +

 if (!show) { el.innerHTML = ''; return; }
