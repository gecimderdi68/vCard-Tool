/* kaydırdıkça aktif harfi vurgula (scroll-spy): harf sırası daima tek yönlü/ileri uyumlu —
   'rastgele harfe atlama' bug'ı, kısa ve heterojen yükseklikte satırların (ghead + emoji img'ler)
   getBoundingClientRect ölçümlerini gecikmeli yapmasıydı; artık satır başına yazılan grup etiketi
   (data-g) üzerinden deterministik hesap yapılır, ölçüm sadece görünürlük eşiği için kullanılır */
let spyRaf = 0, spySuppressUntil = 0;
let listAnim = null;   // aktif yumuşak kaydırma animasyonu

/* alfabe rayı → kişi: hedef satırı listenin ÜSTÜNE getirir (merkeze değil), yumuşak ve isabetli.
   scrollIntoView'in 'yakın mesafeyi atlaması' burada düzeltildi: animasyonu kendimiz çiziyoruz,
   scrollTop hedefi = satırın konteyner içindeki gerçek konumundan hesaplanır */
function smoothScrollListToPid(pid) {
  const list = $('#list');
  const row = list.querySelector(`.row[data-pid="${pid}"]`);
  if (!row) return;
  if (listAnim) cancelAnimationFrame(listAnim);
  const rowTop = row.offsetTop - list.offsetTop;       // içerik koordinatında satırın yeri
  const target = Math.max(0, Math.min(rowTop - 12, list.scrollHeight - list.clientHeight));
  const from = list.scrollTop, dist = target - from;
  if (Math.abs(dist) < 2) { list.scrollTop = target; return; }
  const dur = Math.min(900, 260 + Math.abs(dist) * 0.35);   // mesafe arttıkça süreyi nazikçe uzat
  const t0 = performance.now();
  spySuppressUntil = Date.now() + dur + 80;             // animasyon bitene kadar harf spy'ı sustur
  const easeOut = t => 1 - Math.pow(1 - t, 3);          // yumuşak bitiş (cubic ease-out)
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    list.scrollTop = from + dist * easeOut(t);
    if (t < 1) listAnim = requestAnimationFrame(step);
    else { listAnim = null; updateActiveLetter(); }
  };
  listAnim = requestAnimationFrame(step);
}

/* ---------- özel kaydırma çubukları (JS ile çizilir) ----------
   liste ve alfabe rayı AYNI formülü kullanır: topuz boyu = görünür/oran,
   konum = scrollTop / scrollHeight. Böylece iki çubuğun renkli kısmı birebir aynı kuralla boyutlanır */
function makeCustomScrollbar(scrollEl, barEl, place, maxThumbH) {
  if (!scrollEl || !barEl) return () => {};
  barEl.innerHTML = '<div class="sb-thumb"></div>';
  const thumb = barEl.firstChild;
  const update = () => {
    if (place) place();
    const sh = scrollEl.scrollHeight, ch = scrollEl.clientHeight;
    if (sh <= ch + 1) { barEl.style.opacity = '0'; return; }   // kaydırma yoksa çubuk gizli
    barEl.style.opacity = '1';
    const track = ch;                                          // bar üst:8/alt:8 → ray = ch-16
    const minH = parseFloat(getComputedStyle(thumb).minHeight) || 34;
    let th = Math.max(minH, Math.round((ch - 16) * ch / sh));
    if (maxThumbH) th = Math.min(th, maxThumbH);               // ray çubuğu aşırı uzamasın
    thumb.style.height = th + 'px';
    const ratio = sh > ch ? scrollEl.scrollTop / (sh - ch) : 0;
    thumb.style.top = Math.round(ratio * (track - th)) + 'px';
  };
  scrollEl.addEventListener('scroll', update, { passive: true });
  if (typeof ResizeObserver === 'function') new ResizeObserver(update).observe(scrollEl);
  else window.addEventListener('resize', update);
  /* çubuğa tıklayarak atlama: tıklanan yere yumuşakça kaydır */
  barEl.addEventListener('click', e => {
    const rect = barEl.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    const target = frac * (scrollEl.scrollHeight - scrollEl.clientHeight);
    smoothScrollElTo(scrollEl, target);
  });
  update();
  return update;
}
/* genel amaçlı yumuşak kaydırma (özel çubuk tıklaması): easeInOut, ~450ms sabit */
function smoothScrollElTo(el, target) {
  if (el === $('#list') && listAnim) { cancelAnimationFrame(listAnim); listAnim = null; }
  const from = el.scrollTop, dist = target - from;
  if (Math.abs(dist) < 2) { el.scrollTop = target; return; }
  const dur = Math.min(900, 260 + Math.abs(dist) * 0.35);
  const t0 = performance.now();
  if (el === $('#list')) spySuppressUntil = Date.now() + dur + 80;
  const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    el.scrollTop = from + dist * easeInOut(t);
    if (t < 1) requestAnimationFrame(step);
    else if (el === $('#list')) updateActiveLetter();
  };
  requestAnimationFrame(step);
}
let updateSbList = () => {}, updateSbAlpha = () => {};
function initCustomScrollbars() {
  const list = $('#list'), strip = $('#alphaStrip');
  if (!list || !strip) return;
  let barList = $('#sbList'), barAlpha = $('#sbAlpha');
  if (!barList) { barList = document.createElement('div'); barList.id = 'sbList'; barList.className = 'custom-sb'; list.parentElement.appendChild(barList); }
  if (!barAlpha) { barAlpha = document.createElement('div'); barAlpha.id = 'sbAlpha'; barAlpha.className = 'custom-sb'; list.parentElement.appendChild(barAlpha); }
  updateSbList = makeCustomScrollbar(list, barList);
  /* rayın çubuğu #listWrap içinde ama rayın hemen sağında konumlanmalı: her güncellemede rayın offset'inden hesaplanır */
  updateSbAlpha = makeCustomScrollbar(strip, barAlpha, () => {
    barAlpha.style.left = (strip.offsetLeft + strip.offsetWidth + 2) + 'px';
    barAlpha.style.right = 'auto';
  }, 64);   // renkli kısım en fazla 64px: 40 harfli rayda dev topuz olmasın
  updateSbList(); updateSbAlpha();
}

function scrollStripTo(btn) {
  const strip = $('#alphaStrip');
  const top = btn.offsetTop, bot = top + btn.offsetHeight;
  if (top < strip.scrollTop) strip.scrollTop = top - 4;
  else if (bot > strip.scrollTop + strip.clientHeight) strip.scrollTop = bot - strip.clientHeight + 4;
}
function updateActiveLetter() {
  const strip = $('#alphaStrip');
  if (strip.hidden || state.view !== 'single') return;
  const btns = [...strip.querySelectorAll('button[data-g]')];
  const rows = [...$('#list').querySelectorAll('.row[data-pid]')];
  if (!btns.length || !rows.length) return;
  /* satırlar zaten alfabetik sıralı: görünen ilk satırın grubu = aktif grup.
     Reflow'a girmeden: scroll + offsetTop yeterli. Konteyner üst noktası: */
  const list = $('#list');
  const cut = list.scrollTop + 40;   // konteyner tepesinden 40px aşağısı 'görünür' sayılır
  let activeG = null;
  let lastRow = null;
  for (const r of rows) {
    lastRow = r;
    if (r.offsetTop + r.offsetHeight >= cut) { activeG = alphaGroupOf(state.people.get(r.dataset.pid)); break; }
  }
  if (!activeG && lastRow) activeG = alphaGroupOf(state.people.get(lastRow.dataset.pid));
  if (!activeG) return;
  const btn = btns.find(b => b.dataset.g === activeG);
  if (!btn || btn.classList.contains('here')) { if (btn) scrollStripTo(btn); return; }
  btns.forEach(b => b.classList.toggle('here', b === btn));
  scrollStripTo(btn);
  updateSbAlpha();
}

/* ---------- kaydedilmemiş değişiklik takibi (kapanış onayı) ---------- */
function markDirty() { state.dirty = true; }
function markExported() {
  if (state.draftName) state.exportedOnce = true;   // oluşturulan dosya: indirildi
  state.dirty = false;                              // kaydedildi: temiz durum
}
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('beforeunload', e => {
    if (!state.dirty) return;
    e.preventDefault();
    e.returnValue = '';   // tarayıcı kendi onay metnini gösterir
  });
}

/* ---------- toplu seçim çubuğu ---------- */
function renderSelection() {
  const bar = $('#selbar');
  const n = state.selection.size;
  bar.hidden = n === 0;
  if (!n) return;
  $('#selbarText').textContent = t('sel.count', { n });
}

/* o an ekranda görünen herkesi seç / seçimi kaldır (görünür liste = aktif sekme + arama/filtre) */
function selectAllVisible() {
  for (const p of allVisiblePeople()) state.selection.add(p.pid);
  renderSelection(); renderList();
}
function clearSelection() {
  state.selection.clear();
  renderSelection(); renderList();
}

function toggleSelection(pid, on) {
  if (on) state.selection.add(pid); else state.selection.delete(pid);
  renderSelection();
}

function renderAll() {
  rebuildCompare();
  renderToolbar();
  renderTabs();
  renderCount();
  renderAlpha();
  renderList();
  if (typeof updateSbList === 'function') requestAnimationFrame(() => { updateSbList(); updateSbAlpha(); });
}

/* ---------- etkileşimler ---------- */
function mark(pid, action) {
  renderCount(); renderList();
}

function delContact(pid) {
  const p = state.people.get(pid); if (!p) return;
  openConfirm(t('confirm.delTitle'), t('confirm.delText', { name: esc(p.name) }), t('del'), () => {
    state.people.delete(pid); state.deleted.add(pid); state.selection.delete(pid);
    const s = state.slots[p.slot]; if (s && s.count > 0) s.count--;
    markDirty();
    toast(t('toast.deleted')); renderAll();
  });
}

/* işaretlenen kişileri toplu sil: onay sor → sil */
function deleteSelected() {
  const ids = [...state.selection].filter(pid => state.people.has(pid));
  if (!ids.length) return;
  openConfirm(t('sel.delTitle'), t('sel.delText', { n: ids.length }), t('del'), () => {
    for (const pid of ids) {
      const p = state.people.get(pid);
      if (p) { const s = state.slots[p.slot]; if (s && s.count > 0) s.count--; }
      state.people.delete(pid); state.deleted.add(pid);
    }
    state.selection.clear();
    markDirty();
    toast(t('toast.bulkDeleted', { n: ids.length }));
    renderAll();
  });
}

function addContact(pid) {
  const p = state.people.get(pid); if (!p) return;
  state.deleted.add(pid);
  markDirty();
  toast(t('toast.added', { name: trunc(p.name, 22) }));
  renderCount(); renderList();
}

/* dosya sekmesindeki ✕: dosyayı listeden kaldır (onay sorar) */
function closeFile(slot) {
  const s = state.slots[slot];
  if (!s) return;
  const isDraft = state.draftName && slot === state.slots.length - 1;
  const n = state.people.size
    ? [...state.people.values()].filter(p => p.slot === slot).length
    : (s.count || 0);
  const pending = isDraft && !state.exportedOnce;
  openConfirm(t('closef.title'), pending
    ? t('closef.textPending', { name: esc(trunc(s.name, 30)), n })
    : t('closef.text', { name: esc(trunc(s.name, 30)), n }), t('closef.ok'), () => {
    for (const [pid, p] of [...state.people]) if (p.slot === slot) { state.people.delete(pid); state.selection.delete(pid); }
    state.slots[slot] = undefined;
    if (isDraft) { state.draftName = null; state.exportedOnce = false; }
    if (state.activeTab === 'f' + slot) { state.activeTab = 'all'; state.view = 'single'; }
    renderAll();   // renderTabs: kapanış sonrası 1 dosya kaldıysa Tam Liste gizlenir, tek sekmeye düşer
    addToast(t('closef.done', { name: trunc(s.name, 24) }), '📂');
  });
}

function addContactNew() {
  /* yeni kişi, en son içe aktarılan/oluşturulan dosyanın slot'una eklenir */
  const slot = state.activeSlot;
  const p = { pid: 'p' + (state.nextPid++), slot, name: '', phones: [''], emails: [], note: '', custom: [] };
  state.people.set(p.pid, p);
  state.slots[slot] && state.slots[slot].count++;
  state.search = ''; $('#searchInput').value = '';
  renderAll();
  openPerson(p.pid, true);
  return p;
}

/* ---------- kişi düzenleme modalı ---------- */
let editingPid = null;
function openPerson(pid, isNew) {
  const p = state.people.get(pid); if (!p) return;
  editingPid = pid;
  const card = $('#personCard');
  card.innerHTML = `
    <div class="modal-head">
      <h2>${isNew ? t('pm.new') : t('pm.edit')}</h2>
      <button class="icon-btn" data-close="personModal"><span class="eic" data-emoji="❌" data-done="1">${emojiImgHtml('❌','')}</span></button>
    </div>
    <div class="modal-body">
      <label class="f-label">${t('pm.name')}</label>
      <input class="f-input" id="pmName" value="${esc(p.name)}" placeholder="${t('pm.namePh')}">
      <label class="f-label">${t('pm.phones')}</label>
      <div id="pmPhones"></div>
      <button class="ghost" id="pmAddPhone">${I.plus} ${t('pm.addPhone')}</button>
      <label class="f-label">${t('pm.emails')}</label>
      <div id="pmEmails"></div>
      <button class="ghost" id="pmAddEmail">${I.plus} ${t('pm.addEmail')}</button>
      <label class="f-label">${t('pm.note')}</label>
      <input class="f-input" id="pmNote" value="${esc(p.note)}" placeholder="${t('pm.notePh')}">
    </div>
    <div class="modal-foot">
      <button class="btn danger left" id="pmDelete">${I.trash} ${t('del')}</button>
      <button class="btn" id="pmCancel">${t('cancel')}</button>
      <button class="btn primary" id="pmSave">${t('pm.save')}</button>
    </div>`;
  $('#personModal').style.display = 'flex';

  const renderPhones = () => {
    $('#pmPhones').innerHTML = p.phones.map((ph, i) =>
      `<div class="f-row"><input class="f-input pm-phone" data-i="${i}" value="${esc(ph)}" placeholder="0532 000 00 00"><button class="mini del" data-delphone="${i}">${I.trash}</button></div>`).join('');
  };
  const renderEmails = () => {
    $('#pmEmails').innerHTML = p.emails.map((em, i) =>
      `<div class="f-row"><input class="f-input pm-email" data-i="${i}" value="${esc(em)}" placeholder="ornek@mail.com"><button class="mini del" data-delemail="${i}">${I.trash}</button></div>`).join('');
  };
  renderPhones(); renderEmails();

  $('#pmAddPhone').onclick = () => { p.phones.push(''); renderPhones(); const inputs = $$('#pmPhones .pm-phone'); inputs[inputs.length - 1]?.focus(); };
  $('#pmAddEmail').onclick = () => { p.emails.push(''); renderEmails(); const inputs = $$('#pmEmails .pm-email'); inputs[inputs.length - 1]?.focus(); };
  $('#pmPhones').onclick = e => { const b = e.target.closest('[data-delphone]'); if (b) { p.phones.splice(+b.dataset.delphone, 1); renderPhones(); } };
  $('#pmEmails').onclick = e => { const b = e.target.closest('[data-delemail]'); if (b) { p.emails.splice(+b.dataset.delemail, 1); renderEmails(); } };
  $('#pmCancel').onclick = () => {
    if (isNew && !p.name && !p.phones.some(Boolean)) {
      state.people.delete(pid); state.selection.delete(pid);
      const s = state.slots[p.slot]; if (s && s.count > 0) s.count--;   // eklenmişti, geri al
    }
    closeAll(); renderAll();
  };
  $('#pmDelete').onclick = () => {
    closeAll();
    state.people.delete(pid); state.deleted.add(pid); state.selection.delete(pid);
    markDirty();
    toast(t('toast.deleted')); renderAll();
  };
  $('#pmSave').onclick = () => {
    const name = $('#pmName').value.trim();
    const phones = $$('#pmPhones .pm-phone').map(i => i.value.trim()).filter(Boolean);
    const emails = $$('#pmEmails .pm-email').map(i => i.value.trim()).filter(Boolean);
    const note = $('#pmNote').value.trim();
    if (!name && !phones.length) { state.people.delete(pid); toast(t('toast.emptyPerson'), true); closeAll(); renderAll(); return; }
    p.name = name || phones[0] || t('pm.unnamed');
    p.phones = phones; p.emails = emails; p.note = note;
    markDirty();
    closeAll(); toast(t('toast.saved')); renderAll();
  };
  setTimeout(() => $('#pmName')?.focus(), 40);
}

/* ---------- vCard oluştur: isim sor → dosya yalnızca bellekte açılır, diske yazılmaz ---------- */
function openVcfNameModal() {
  const m = $('#vcfNameModal');
  m.style.display = 'flex';
  $('#vcfNameInput').value = '';
  setTimeout(() => $('#vcfNameInput')?.focus(), 40);
}

function createVcfAsFile() {
  const raw = $('#vcfNameInput').value.trim();
  if (!raw) { toast(t('toast.nameRequired'), true); $('#vcfNameInput').focus(); return; }
  const fname = raw.replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60) + '.vcf';
  closeAll();
  const slot = state.slots.length;
  state.slots.push({ name: fname, count: 0 });
  state.draftName = fname;
  state.exportedOnce = false;   // yeni dosya: henüz dışa aktarılmadı
  state.activeSlot = slot;   // yeni kişiler bu dosyaya eklenir
  state.activeTab = 'f' + slot;
  state.view = 'single'; state.filterMode = 'all'; state.pendingEdits.clear();
  markDirty();
  renderAll();
  addToast(t('toast.vcfCreated', { name: trunc(fname, 24) }), '🗂️');   // sekme açıldı; kişi eklemek kullanıcıya kalmış
}

/* ---------- onay modalı ---------- */
let confirmCb = null;
function openConfirm(title, textHtml, okLabel, cb) {
  $('#confirmTitle').textContent = title;
  $('#confirmText').innerHTML = textHtml;
  $('#confirmOk').textContent = okLabel || 'Tamam';
  confirmCb = cb;
  $('#confirmModal').style.display = 'flex';
}

/* ---------- birleştirme modalı ---------- */
let mergeCtx = null;
function openMerge() {
  if (state.slots.filter(Boolean).length < 2) { toast(t('toast.needBoth'), true); return; }
  const cmp = rebuildCompare();
  const pairList = [...cmp.pairs.entries()].map(([x, y]) => ({ a: state.people.get(x), b: state.people.get(y) })).filter(it => it.a && it.b);
  if (!pairList.length) { toast(t('toast.noCommon'), true); return; }
  mergeCtx = { pairs: pairList, keep: 1, idx: {}, mtab: 'all', applied: false };
  $('#mergeModal').style.display = 'flex';
  renderMerge();
}

function mergeStats() {
  let diff = 0;
  for (const { a, b } of mergeCtx.pairs) if (sameName(a.name) !== sameName(b.name)) diff++;
  return { total: mergeCtx.pairs.length, diff, onlyA: state.compare.onlyA.length, onlyB: state.compare.onlyB.length };
}

/* karşılaştırma kaynak dosyalarının adları (birleştirme modalı + özet kartları) */
function srcFileName(slot) { return state.slots[slot]?.name || (slot === 0 ? 'A' : 'B'); }

/* tema değişim bildirimi (aktif temaya göre) */
function addThemeToast() {
  const dark = document.documentElement.dataset.theme !== 'light';
  addToast(state.lang === 'tr' ? (dark ? 'Koyu temaya geçildi' : 'Açık temaya geçildi') : (dark ? 'Switched to dark theme' : 'Switched to light theme'), dark ? '🌙' : '🌞');
}

function renderMerge() {
  const st = mergeStats();
  const sum = $('#mergeSummary');
  if (mergeCtx.applied) {
    sum.innerHTML = `<div class="mdone">${I.check} ${t('merge.applied', { n: mergeCtx.appliedTotal })}</div>`;
  } else {
    sum.innerHTML = `<div class="sumcards">
      <div class="sumcard"><div class="v">${st.total}</div><div class="l">${t('merge.cDuplicates')}</div></div>
      <div class="sumcard warn"><div class="v">${st.diff}</div><div class="l">${t('merge.cDiff')}</div></div>
      <div class="sumcard"><div class="v">${st.onlyA}</div><div class="l">${t('merge.onlyInFile', { name: esc(trunc(srcFileName(0), 14)) })}</div></div>
      <div class="sumcard"><div class="v">${st.onlyB}</div><div class="l">${t('merge.onlyInFile', { name: esc(trunc(srcFileName(1), 14)) })}</div></div>
    </div>
    <div class="mnote">${t('merge.note')}</div>`;
  }
  $$('#mergeTabs .tab').forEach(t => t.classList.toggle('on', t.dataset.mtab === mergeCtx.mtab));

  const list = $('#mergeList');
  const rows = [];
  for (const [i, it] of mergeCtx.pairs.entries()) {
    if (mergeCtx.mtab === 'diff' && sameName(it.a.name) === sameName(it.b.name)) continue;
    const keep = mergeCtx.idx[i] !== undefined ? mergeCtx.idx[i] : mergeCtx.keep;
    const winner = keep === 1 ? it.a : it.b;
    const same = sameName(it.a.name) === sameName(it.b.name);
    const status = same ? t('merge.sameStatus')
      : t('merge.diffStatus', { a: esc(trunc(it.a.name, 16)), b: esc(trunc(it.b.name, 16)), w: esc(trunc(winner.name, 16)) });
    const phones = new Map();
    for (const ph of it.a.phones) phones.set(normPhone(ph), { ph, side: 'a' });
    for (const ph of it.b.phones) { const k = normPhone(ph); if (phones.has(k)) phones.get(k).side = 'ab'; else phones.set(k, { ph, side: 'b' }); }
    const chips = [...phones.values()].sort((x, y) => x.ph.localeCompare(y.ph, 'tr', { numeric: true }))
      .map(({ ph, side }) => {
        /* numara hangi dosyadan geldiyse yanında o dosyanın adı gösterilir */
        const src = side === 'a' ? srcFileName(0) : side === 'b' ? srcFileName(1) : null;
        const srcHtml = src && state.slots.filter(Boolean).length > 1 ? `<span class="srcnm">· ${esc(trunc(src, 12))}</span>` : '';
        return `<span class="chip c-${side}" data-copy="${esc(ph)}">${flagImgHtml(flagForPhone(ph))}${esc(ph)}${srcHtml}</span>`;
      }).join(' ');
    rows.push(`<div class="mrow">
      ${avatarHtml(winner)}
      <div class="m-mid">
        <div class="m-name"><span class="ntxt">${richText(winner.name)}</span> ${same ? '' : `<span class="tag t-ed">${t('tag.namediff')}</span>`}</div>
        <div class="m-sub">${status}</div>
        <div class="chips">${chips || `<span style="font-size:12px;color:var(--muted)">${t('merge.noPhones')}</span>`}</div>
      </div>
      <div class="m-acts">
        <button class="mini ka ${keep === 1 ? 'on' : ''}" data-keep="1" data-i="${i}" title="${t('merge.keepFile', { name: esc(trunc(srcFileName(0), 18)) })}">◀</button>
        <button class="mini kb ${keep === 0 ? 'on' : ''}" data-keep="0" data-i="${i}" title="${t('merge.keepFile', { name: esc(trunc(srcFileName(1), 18)) })}">▶</button>
        <button class="mini rst ${mergeCtx.idx[i] !== undefined ? 'on' : ''}" data-reset="${i}" title="${t('merge.reset')}">↺</button>
      </div>
    </div>`);
  }
  list.innerHTML = rows.join('') || `<div class="empty" style="padding:30px"><h3>${t('merge.none')}</h3></div>`;
}

function applyMerge() {
  if (mergeCtx.applied) { toast('Zaten kaydedildi'); return; }
  let removedTotal = 0, changedTotal = 0;
  for (const [i, it] of mergeCtx.pairs.entries()) {
    const keep = mergeCtx.idx[i] !== undefined ? mergeCtx.idx[i] : mergeCtx.keep;
    const winner = keep === 1 ? it.a : it.b;
    const loser = keep === 1 ? it.b : it.a;
    if (sameName(it.a.name) !== sameName(it.b.name)) changedTotal++;
    for (const ph of loser.phones) if (!winner.phones.some(x => samePhone(x) === samePhone(ph))) winner.phones.push(ph);
    for (const em of loser.emails) if (!winner.emails.some(x => sameEmail(x) === sameEmail(em))) winner.emails.push(em);
    if (!winner.noteCountry && loser.noteCountry) winner.noteCountry = loser.noteCountry;
    state.people.delete(loser.pid); state.deleted.add(loser.pid);
    removedTotal++;
  }
  mergeCtx.applied = true;
  mergeCtx.appliedTotal = removedTotal;
  markDirty();
  toast(t('toast.mergeDone', { a: removedTotal, b: changedTotal }));
  renderAll();
  renderMerge();
}

/* ---------- dışa aktarma ---------- */
/* vCard üretimi — sıralama kritik: Android/İOS Kişiler uygulaması dosyadaki kişi sırasını
   N (soyad, ad) alanına göre KENDİ collation'ı ile belirler (FN'i kullanmaz!).
   Bu yüzden N alanını tamamen boş bırakıp (N:;;;;) sıralamayı tek başına FN'e devrediyoruz:
   "🇹🇷 Ahmet" "Ahmet" ile, "#Proje" "#Proje" ile, "王伟" "王伟" ile alfabetize olur —
   yani sitenin ekranda gördüğün sırasıyla birebir aynı sıra telefonun listesinde çıkar.
   Dosyadaki kişi blokları da zaten o sırayla yazılır (downloadVcf → comparePeople) */
function vcardFor(p) {
  const semi = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const parts = ['BEGIN:VCARD', 'VERSION:3.0'];
  parts.push('N:;;;;');   // soyad/ad boş: telefonda FN ile alfabetize olur (ekrandaki sıra korunur)
  parts.push(`FN:${semi(p.name)}`);
  for (const ph of p.phones) parts.push(`TEL;TYPE=CELL:${ph}`);
  for (const em of p.emails) parts.push(`EMAIL;TYPE=INTERNET:${em}`);
  // ülke kodunu NOTE parametresine gömeriz: telefona geri aktarımda bayrak kaybolmasın
  // (değeri bozmayız — başka uygulamalarda not metni temiz kalır)
  const cc = p.noteCountry || countryFromPhone(p.phones[0] || '');
  if (p.note) parts.push(cc ? `NOTE;X-ABNOTE-COUNTRY=${cc.toUpperCase()}:${semi(p.note)}` : `NOTE:${semi(p.note)}`);
  for (const c of (p.custom || [])) parts.push(`${c.key}:${semi(c.value)}`);
  parts.push('END:VCARD');
  return parts.join('\r\n');
}

function saveBlob(text, filename) {
  const blob = new Blob([text], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 0);
}

function downloadVcf(list, filename) {
  if (!list.length) { toast(t('toast.nothingToExport'), true); return; }
  /* kişi blokları telefonda görünecek sırayla yazılır: comparePeople = sitenin liste sırası
     (emoji/CJK/sem bol grup akışı dahil) → telefonun rehberi siteyle aynı sırayla gösterir */
  const sorted = [...list].sort(comparePeople);
  saveBlob(sorted.map(vcardFor).join('\r\n'), filename);
  markExported();   // kaydedildi: kapanış onayı gerekmez
  toast(t('toast.exported', { n: sorted.length }));
}

/* ---------- pano ---------- */
function copyText(v) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(v).then(() => toast(t('toast.copied', { v: trunc(v, 24) })), () => fallbackCopy(v));
  } else fallbackCopy(v);
}
function fallbackCopy(v) {
  const ta = document.createElement('textarea');
  ta.value = v; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(t('toast.copied', { v: trunc(v, 24) })); } catch (e) { toast(t('toast.copyfail'), true); }
  ta.remove();
}

/* ---------- toast / modal yardımcıları ---------- */
let toastTimer = null;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* yığılabilir, ikonlu bildirimler (birden fazla mesaj aynı anda görünür) */
function addToast(msg, emoji, isErr) {
  const box = $('#toastBox');
  if (!box) { toast(msg, isErr); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.innerHTML = (emoji ? `<span class="eic">${emojiImgHtml(emoji, '')}</span>` : '') + `<span>${esc(msg)}</span>`;
  box.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  setTimeout(() => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 350);
  }, 3000);
}

function closeAll() {
  $$('.modal-back').forEach(m => {
    if (m.style.display !== 'flex') return;
    m.classList.add('closing');
    setTimeout(() => { m.style.display = 'none'; m.classList.remove('closing'); }, 210);
  });
}

/* ---------- olay bağlama ---------- */
function bindEvents() {
  $('#file1').addEventListener('change', e => {
    for (const f of e.target.files) {
      const slot = state.slots.findIndex(s => !s);
      loadInto(slot === -1 ? state.slots.length : slot, f);
    }
    e.target.value = '';
  });
  $('#chip0').addEventListener('click', () => $('#file1').click());

  $('#compareBtn').addEventListener('click', () => {
    const loaded = state.slots.filter(Boolean).length;
    if (loaded < 2) { toast(t('toast.needBoth'), true); return; }
    switchCombined();
  });

  function switchCombined() {
    state.view = 'combined'; state.activeTab = 'all'; state.filterMode = 'all';
    renderAll();
  }

  $('#mergeBtn').addEventListener('click', openMerge);
  $('#vcfNameOk').addEventListener('click', createVcfAsFile);
  $('#vcfNameCancel').addEventListener('click', closeAll);
  $('#vcfNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') createVcfAsFile(); });
  $('#addPersonBtn').addEventListener('click', addContactNew);
  $('#addVcfBtn').addEventListener('click', openVcfNameModal);

  /* toplu seçim çubuğu + slide-up animasyonu (hidden→flex geçişinde tetiklenir) */
  const selbarEl = $('#selbar');
  new MutationObserver(() => {
    if (!selbarEl.hidden) { selbarEl.classList.remove('showing'); void selbarEl.offsetWidth; selbarEl.classList.add('showing'); }
  }).observe(selbarEl, { attributes: true, attributeFilter: ['hidden'] });

  $('#selDelete').addEventListener('click', deleteSelected);
  $('#selClear').addEventListener('click', clearSelection);
  $('#selAll').addEventListener('click', selectAllVisible);
  $('#selNone').addEventListener('click', () => { state.selection.clear(); renderSelection(); renderList(); });

  /* alfabe rayı: harfe/gruba tıklayınca o gruptaki ilk kişiye yumuşakça kaydır */
  $('#alphaStrip').addEventListener('click', e => {
    const b = e.target.closest('[data-goto]'); if (!b) return;
    $$('#alphaStrip button').forEach(x => x.classList.toggle('here', x === b));
    scrollStripTo(b);
    smoothScrollListToPid(b.dataset.goto);
  });

  /* liste kaydırıldıkça aktif harfi güncelle + alt gradyanı yönet (rAF ile kısıtlanmış) */
  $('#list').addEventListener('scroll', e => {
    const el = e.target;
    const more = el.scrollTop + el.clientHeight < el.scrollHeight - 4;
    $('#listWrap').classList.toggle('scrolled', more);
    if (Date.now() < spySuppressUntil || spyRaf) return;
    spyRaf = requestAnimationFrame(() => { spyRaf = 0; updateActiveLetter(); });
  }, { passive: true });

  /* başlangıçta da gradyan durumunu hesapla (liste kısa ise gradyan çıkmasın) */
  new MutationObserver(() => {
    const el = $('#list');
    const more = el.scrollTop + el.clientHeight < el.scrollHeight - 4;
    $('#listWrap').classList.toggle('scrolled', more);
  }).observe($('#list'), { childList: true });
  $('#exportVcf').addEventListener('click', () => {
    /* oluşturulan dosyanın kendi sekmesindeysek indirilen dosya, oluştururken verilen adı taşır */
    if (state.draftName && state.view === 'single' && state.activeTab === 'f' + (state.slots.length - 1)) {
      downloadVcf(visibleSingleList(), state.draftName);
      markExported();
      return;
    }
    /* aktif sekme + arama + filtre: ekranda görünen liste indirilir */
    downloadVcf(visibleSingleList(), t('file.prefix') + '-' + new Date().toISOString().slice(0, 10) + '.vcf');
  });
  $('#exportCombined').addEventListener('click', () => downloadVcf(currentFilteredCombined().map(it => it.p), t('file.compare') + '-' + new Date().toISOString().slice(0, 10) + '.vcf'));

  $('#tabs').addEventListener('click', e => {
    /* sekme üzerindeki ✕: dosyayı kapat (onay sor) */
    const xb = e.target.closest('[data-closefile]');
    if (xb) { e.stopPropagation(); closeFile(+xb.dataset.closefile); return; }
    const t = e.target.closest('.tab'); if (!t) return;
    const tab = t.dataset.tab;
    if (tab === 'all') {
      if (state.view === 'combined') { state.view = 'single'; state.activeTab = 'all'; renderAll(); }
      else { state.activeTab = 'all'; renderAll(); }
      return;
    }
    if (!/^f\d+$/.test(tab)) return;   // yalnızca dosya sekmeleri
    // dosya sekmesi: her zaman tek liste görünümü
    if (state.view === 'combined') { state.view = 'single'; state.pendingEdits.clear(); }
    state.activeTab = tab; state.search = ''; $('#searchInput').value = '';
    renderAll();
  });

  $$('#panelCombined [data-filter]').forEach(b => b.addEventListener('click', () => {
    state.filterMode = b.dataset.filter; renderTabs(); renderCount(); renderList();
  }));

  $('#searchInput').addEventListener('input', e => { state.search = e.target.value; renderCount(); renderList(); });
  $('#searchInput2').addEventListener('input', e => { state.search2 = e.target.value; renderCount(); renderList(); });

  $('#list').addEventListener('click', e => {
    if (e.target.closest('.selbox')) return;   // kutucuk tıkları change olayında işlenir, satır açılmasın
    const row = e.target.closest('.row'); if (!row) return;
    const pid = row.dataset.pid;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'edit') { editOrOpen(pid); return; }
    if (act === 'del') { delContact(pid); return; }
    if (act === 'keep') { mark(pid, 'keep'); return; }
    if (act === 'discard') { mark(pid, 'discard'); return; }
    if (act === 'add') { addContact(pid); return; }
    if (e.target.closest('.chip')) { return; }
    if (state.view === 'combined') { addContact(pid); return; }
    editOrOpen(pid);
  });

  // numara çiplerine tıklayınca kopyala (liste + birleştirme modalı)
  document.addEventListener('click', e => {
    const chip = e.target.closest('.chip[data-copy]');
    if (chip) { e.stopPropagation(); copyText(chip.dataset.copy); }
  }, true);

  // seçim kutucukları: işaretle/kaldır (change, delege edilmiş)
  $('#list').addEventListener('change', e => {
    const box = e.target.closest('.selbox'); if (!box) return;
    const row = box.closest('.row'); if (!row) return;
    toggleSelection(row.dataset.pid, box.checked);
  });

  function editOrOpen(pid) {
    const p = state.people.get(pid); if (!p) return;
    openPerson(pid, false);
  }

  /* merge modal içi olaylar */
  $('#mergeTabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t || !mergeCtx) return;
    mergeCtx.mtab = t.dataset.mtab; renderMerge();
  });
  $('#mergeList').addEventListener('click', e => {
    if (!mergeCtx || mergeCtx.applied) return;
    const kb = e.target.closest('[data-keep]');
    if (kb) { mergeCtx.idx[+kb.dataset.i] = +kb.dataset.keep; renderMerge(); return; }
    const rs = e.target.closest('[data-reset]');
    if (rs) { delete mergeCtx.idx[+rs.dataset.reset]; renderMerge(); }
  });
  $('#mergeDiscardAll').addEventListener('click', () => {
    if (!mergeCtx || mergeCtx.applied) return;
    mergeCtx.keep = mergeCtx.keep === 1 ? 0 : 1;
    mergeCtx.idx = {};
    toast(mergeCtx.keep === 1 ? t('merge.keepAllA') : t('merge.keepAllB'));
    renderMerge();
  });
  $('#mergeApply').addEventListener('click', applyMerge);
  $('#mergeFinish').addEventListener('click', () => { closeAll(); });

  /* onay modalı */
  $('#confirmOk').addEventListener('click', () => { const cb = confirmCb; confirmCb = null; closeAll(); cb && cb(); });
  $('#confirmCancel').addEventListener('click', closeAll);

  /* dil geçişi: buton AKTİF dilin bayrağını taşır */
  $('#langBtn').addEventListener('click', () => {
    document.documentElement.lang = document.documentElement.lang === 'en' ? 'tr' : 'en';
    applyI18n();
    addToast(state.lang === 'tr' ? 'Dil Türkçe olarak ayarlandı' : 'Language set to English', state.lang === 'tr' ? '🇹🇷' : '🇬🇧');
  });

  /* genel kapatma — dinamik modallar için delege edilmiş */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-close]');
    if (b) { closeAll(); if (b.dataset.close === 'personModal' && editingPid) { const p = state.people.get(editingPid); if (p && !p.name && !p.phones.some(Boolean)) { state.people.delete(editingPid); state.selection.delete(editingPid); const s = state.slots[p.slot]; if (s && s.count > 0) s.count--; editingPid = null; renderAll(); } } }
  });
  $$('.modal-back').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) closeAll(); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  /* yardım & tema */
  $('#helpBtn').addEventListener('click', () => { $('#helpModal').style.display = 'flex'; });
  $('#themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    addThemeToast();
  });

  /* sürükleyip bırakarak dosya yükleme: sayfanın her yerine .vcf bırakılabilir */
  /* emoji/ikon görselleri sürüklenemez (yanlışlıkla sayfaya "dosya" gibi bırakılmasın) */
  document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG' || e.target.closest('.eic, .empty, .avatar, .chip')) e.preventDefault(); });
  const dropZone = document.body, overlay = $('#dropOverlay');
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; overlay.style.display = 'flex'; });
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; overlay.style.display = 'none'; } });
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; overlay.style.display = 'none';
    const all = [...(e.dataTransfer?.files || [])];
    const files = all.filter(f => /\.vcf$/i.test(f.name) || /vcard/i.test(f.type));
    if (all.length && !files.length) { toast(t('drop.invalid'), true); return; }
    if (!files.length) return;
    for (const f of files) {
      const slot = state.slots.findIndex(s => !s);
      loadInto(slot === -1 ? state.slots.length : slot, f);
    }
  });

}
